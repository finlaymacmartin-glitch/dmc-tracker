<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Delisle Mowing — Dashboard</title>
  <meta name="description" content="Client, AR, and expense tracker for Delisle Mowing Company">
  <meta name="theme-color" content="#1565c0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DMC">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#bcd9f5" d="M11.4 21.5C11.4 13 8 7.5 3 5.2c6.6 1.4 9.4 7 9.4 16.3Z"/>
        <path fill="#ffffff" d="M12.6 21.5c0-9.6 2.6-14 8.4-16.6-4.7 3.6-7.2 8.2-7.2 16.6Z"/>
      </svg>
      <h1 id="view-title">Delisle Mowing — Today</h1>
    </div>
    <div class="topbar-right">
      <span class="version" id="app-version"></span>
      <button class="topbar-btn" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.2 14.8a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.56 1.03Z"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar">
    <button class="tab active" data-view="dashboard" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
      Today
    </button>
    <button class="tab" data-view="schedule" aria-label="Schedule">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17"/><path d="M8 2.8v4M16 2.8v4"/><path d="M8 14.5l2.6 2.6 5-5"/></svg>
      Schedule
    </button>
    <button class="tab" data-view="clients" aria-label="Clients">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.8"/><path d="M4.5 20.5c.6-4 3.6-6 7.5-6s6.9 2 7.5 6"/></svg>
      Clients
    </button>
    <button class="tab" data-view="crew" aria-label="Crew">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7.8" r="3.2"/><path d="M2.8 20c.5-3.4 3-5.2 6.2-5.2s5.7 1.8 6.2 5.2"/><circle cx="17" cy="8.6" r="2.6"/><path d="M15.4 14.9c.5-.1 1-.2 1.6-.2 2.6 0 4.7 1.5 5.2 4.3"/></svg>
      Crew
    </button>
    <button class="tab" data-view="invoices" aria-label="Money">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6.5v11"/><path d="M14.8 8.8c-.6-.8-1.6-1.3-2.8-1.3-1.7 0-2.9.9-2.9 2.2 0 2.9 5.8 1.6 5.8 4.5 0 1.4-1.2 2.3-2.9 2.3-1.2 0-2.3-.5-2.9-1.3"/></svg>
      Money
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
